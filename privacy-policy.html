<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Gideon Technologies</title>
    <meta name="description" content="Privacy Policy for Gideon Technologies - how we collect, use, and protect your information.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230D8B92'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
    <script>
        (() => {
            const stored = localStorage.getItem("gideonTheme");
            const param = new URLSearchParams(window.location.search).get("scoutTheme");
            const theme = param || stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
  <script type="module" crossorigin src="./assets/privacy.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/chunk-theme.js">
  <link rel="stylesheet" crossorigin href="./assets/theme.css">
</head>
<body>
    <div id="root"></div>
</body>
</html>
